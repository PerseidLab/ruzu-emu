name: Build and Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag (leave empty for automatic CI version)"
        required: false
        type: string
        default: ""
      release_name:
        description: "Release name"
        required: false
        type: string
        default: "Ruzu CI Build"
      prerelease:
        description: "Mark release as prerelease"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux AppImage
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            curl \
            git \
            glslang-tools \
            libasound2-dev \
            libavcodec-dev \
            libavutil-dev \
            libclang-dev \
            libdbus-1-dev \
            libdecor-0-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgtk-4-dev \
            libjack-jackd2-dev \
            libopus-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libssl-dev \
            libudev-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            ninja-build \
            pkg-config \
            vulkan-tools \
            wayland-protocols \
            python3 \
            file \
            binutils \
            librsvg2-dev \
            libgirepository1.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Linux AppImage
        run: |
          chmod +x build.sh
          ./build.sh appimage --skip-deps

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: ruzu-linux-x86_64
          path: target/release/*.AppImage
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows ZIP
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Windows
        shell: cmd
        env:
          RUZU_SETUP_ASSUME_YES: "1"
        run: |
          call build.bat
          if errorlevel 1 exit /b 1

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $source = "build/x86_64-pc-windows-msvc/release"

          if (!(Test-Path "$source/ruzu.exe")) {
            throw "Ruzu executable not found"
          }

          New-Item -ItemType Directory -Force -Path dist/release | Out-Null

          Compress-Archive `
            -Path "$source/*" `
            -DestinationPath "dist/release/Ruzu-Windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ruzu-windows-x86_64
          path: dist/release/Ruzu-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs:
      - linux
      - windows

    steps:
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: ruzu-linux-x86_64
          path: release

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: ruzu-windows-x86_64
          path: release

      - name: Generate release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="ci-$(date -u +%Y%m%d)-${RUN_NUMBER}-${RUN_ATTEMPT}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_name }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            release/*.AppImage
            release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
