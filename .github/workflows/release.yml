name: Build and Release

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Select which platform to build"
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - steamdeck
          - windows

      release_tag:
        description: "Release tag (empty = automatic CI tag)"
        required: false
        type: string
        default: ""

      release_name:
        description: "Release name"
        required: true
        type: string
        default: "Ruzu CI Build"

      prerelease:
        description: "Mark release as prerelease"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:

  linux:
    name: Build Linux AppImage
    if: inputs.build_target == 'linux' || inputs.build_target == 'all'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            curl \
            git \
            glslang-tools \
            libasound2-dev \
            libavcodec-dev \
            libavutil-dev \
            libclang-dev \
            libdbus-1-dev \
            libdecor-0-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgtk-4-dev \
            libjack-jackd2-dev \
            libopus-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libssl-dev \
            libudev-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            ninja-build \
            pkg-config \
            python3 \
            file \
            binutils \
            librsvg2-dev \
            libgirepository1.0-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Linux AppImage
        run: |
          chmod +x build.sh
          ./build.sh appimage --skip-deps

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruzu-linux
          path: target/release/*.AppImage
          if-no-files-found: error
          retention-days: 7

  steamdeck:
    name: Build Steam Deck AppImage
    if: inputs.build_target == 'steamdeck' || inputs.build_target == 'all'
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target/steamdeck/cargo

      - name: Build Steam Deck AppImage
        run: |
          chmod +x build.sh
          ./build.sh steamdeck --jobs 2

      - name: Upload Steam Deck artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruzu-steamdeck
          path: |
            target/steamdeck/artifacts/*.AppImage
            target/steamdeck/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows
    if: inputs.build_target == 'windows' || inputs.build_target == 'all'
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install NSIS
        run: choco install nsis -y

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build Windows
        shell: cmd
        run: |
          call build.bat
          if errorlevel 1 exit /b 1

      - name: Create Windows packages
        shell: pwsh
        run: |
          $env:PATH += ";$env:ProgramFiles(x86)\NSIS"

          $packageScript = "dist/package-windows.ps1"

          if (!(Test-Path $packageScript)) {
            throw "Windows package script not found"
          }

          "y" | powershell.exe `
            -NoProfile `
            -ExecutionPolicy Bypass `
            -File $packageScript

          if ($LASTEXITCODE -ne 0) {
            throw "Windows packaging failed"
          }

          $packages = Get-ChildItem target/package -File |
            Where-Object {
              $_.Extension -eq ".zip" -or
              $_.Name.EndsWith("-installer.exe")
            }

          if ($packages.Count -lt 2) {
            throw "Expected Windows ZIP and installer were not generated"
          }

          New-Item -ItemType Directory -Force dist/release | Out-Null

          Copy-Item $packages.FullName dist/release/

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruzu-windows
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - linux
      - steamdeck
      - windows

    if: |
      always() &&
      !cancelled() &&
      (
        (inputs.build_target == 'linux' && needs.linux.result == 'success') ||
        (inputs.build_target == 'steamdeck' && needs.steamdeck.result == 'success') ||
        (inputs.build_target == 'windows' && needs.windows.result == 'success') ||
        (
          inputs.build_target == 'all' &&
          needs.linux.result == 'success' &&
          needs.steamdeck.result == 'success' &&
          needs.windows.result == 'success'
        )
      )

    runs-on: ubuntu-24.04

    steps:
      - name: Download Linux
        if: inputs.build_target == 'linux' || inputs.build_target == 'all'
        uses: actions/download-artifact@v4
        with:
          name: ruzu-linux
          path: release/linux

      - name: Download Steam Deck
        if: inputs.build_target == 'steamdeck' || inputs.build_target == 'all'
        uses: actions/download-artifact@v4
        with:
          name: ruzu-steamdeck
          path: release/steamdeck

      - name: Download Windows
        if: inputs.build_target == 'windows' || inputs.build_target == 'all'
        uses: actions/download-artifact@v4
        with:
          name: ruzu-windows
          path: release/windows

      - name: Generate release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="ci-$(date -u +%Y%m%d)-${RUN_NUMBER}-${RUN_ATTEMPT}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ inputs.release_name }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            release/linux/*
            release/steamdeck/*
            release/windows/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
