
name: Build and Release

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Select which platform to build"
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - steamdeck
          - windows

      release_tag:
        description: "Release tag (empty = automatic CI tag)"
        required: false
        type: string
        default: ""

      release_name:
        description: "Release name"
        required: true
        type: string
        default: "Ruzu CI Build"

      prerelease:
        description: "Mark release as prerelease"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ruzu-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: Build Linux AppImage
    if: inputs.build_target == 'all' || inputs.build_target == 'linux'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            curl \
            git \
            glslang-tools \
            libasound2-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libclang-dev \
            libdbus-1-dev \
            libdecor-0-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libgbm-dev \
            libgl1-mesa-dev \
            libgtk-4-dev \
            libjack-jackd2-dev \
            libopus-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libssl-dev \
            libudev-dev \
            libvulkan-dev \
            libwayland-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libxss-dev \
            libxtst-dev \
            ninja-build \
            pkg-config \
            vulkan-tools \
            wayland-protocols \
            python3 \
            file \
            binutils \
            librsvg2-dev \
            libgirepository1.0-dev

      - name: Verify FFmpeg dependencies
        run: |
          pkg-config --modversion libavcodec
          pkg-config --modversion libavutil
          pkg-config --modversion libswscale

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-appimage

      - name: Build Linux AppImage
        run: |
          chmod +x ./build.sh
          ./build.sh appimage --skip-deps

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruzu-linux
          path: target/release/*.AppImage
          if-no-files-found: error
          retention-days: 7

  steamdeck:
    name: Build Steam Deck AppImage
    if: inputs.build_target == 'all' || inputs.build_target == 'steamdeck'
    runs-on: ubuntu-24.04

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: false
          swap-storage: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 \
            python3-pip \
            pkg-config \
            libswscale-dev

      - name: Verify Steam Deck Docker dependencies
        run: |
          if ! grep -q 'libswscale-dev' scripts/steamdeck/Dockerfile; then
            sed -i 's/libavutil-dev/libavutil-dev libswscale-dev/' \
              scripts/steamdeck/Dockerfile
          fi

          grep -n 'libswscale-dev' scripts/steamdeck/Dockerfile

      - name: Cache Steam Deck Cargo
        uses: actions/cache@v4
        with:
          path: target/steamdeck/cargo
          key: steamdeck-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            steamdeck-cargo-${{ runner.os }}-

      - name: Build Steam Deck AppImage
        run: |
          chmod +x ./build.sh
          ./build.sh steamdeck --jobs 2

      - name: Upload Steam Deck artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruzu-steamdeck
          path: |
            target/steamdeck/artifacts/*.AppImage
            target/steamdeck/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Build Windows
    if: inputs.build_target == 'all' || inputs.build_target == 'windows'
    runs-on: windows-2022

    env:
      RUZU_SETUP_ASSUME_YES: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc

      - name: Build Windows
        shell: cmd
        run: |
          call build.bat
          if errorlevel 1 exit /b 1

      - name: Package Windows
        shell: cmd
        run: |
          echo y| call build.bat package
          if errorlevel 1 exit /b 1

      # Rebuild the ZIP with clean relative paths.
      - name: Fix and verify Windows ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $packageDir = Join-Path $PWD "target/package"

          if (!(Test-Path -LiteralPath $packageDir -PathType Container)) {
            throw "Windows package directory was not created."
          }

          # Find the staged standalone application directory.
          $stageDirs = @(
            Get-ChildItem -LiteralPath $packageDir -Directory |
              Where-Object { $_.Name -like "Ruzu-Windows-*" } |
              Sort-Object LastWriteTime -Descending
          )

          if ($stageDirs.Count -eq 0) {
            throw "No staged Ruzu Windows package directory was found."
          }

          $stage = $stageDirs[0]
          $packageName = $stage.Name

          Write-Host "Staged directory: $($stage.FullName)"

          # Verify the staged application before archiving.
          foreach ($requiredFile in @(
            "ruzu.exe",
            "ruzu-cmd.exe",
            "LICENSE.txt",
            "README.md"
          )) {
            $requiredPath = Join-Path $stage.FullName $requiredFile

            if (!(Test-Path -LiteralPath $requiredPath -PathType Leaf)) {
              throw "Required package file is missing: $requiredFile"
            }
          }

          # Recreate the ZIP using paths relative to the staged directory.
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $zipPath = Join-Path $packageDir "$packageName.zip"

          if (Test-Path -LiteralPath $zipPath) {
            Remove-Item -LiteralPath $zipPath -Force
          }

          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $stage.FullName,
            $zipPath,
            [System.IO.Compression.CompressionLevel]::Optimal,
            $true
          )

          if (!(Test-Path -LiteralPath $zipPath -PathType Leaf)) {
            throw "Failed to create the corrected Windows ZIP."
          }

          # Inspect ZIP entries to ensure they have normal relative paths.
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

          try {
            $entries = @($archive.Entries | ForEach-Object {
              $_.FullName
            })

            if ($entries.Count -eq 0) {
              throw "The Windows ZIP is empty."
            }

            if ($entries | Where-Object {
              $_ -match '^[A-Za-z]:' -or $_ -match '\\'
            }) {
              throw "The ZIP contains absolute paths or backslash separators."
            }

            if (!($entries -contains "$packageName/ruzu.exe")) {
              throw "The ZIP does not contain the expected root folder and ruzu.exe."
            }

            if (!($entries -contains "$packageName/ruzu-cmd.exe")) {
              throw "The ZIP does not contain ruzu-cmd.exe."
            }

            Write-Host "Verified ZIP entries:"
            $entries | Select-Object -First 30 | ForEach-Object {
              Write-Host "  $_"
            }
          }
          finally {
            $archive.Dispose()
          }

          # Verify the NSIS installer.
          $installerPath = Join-Path $packageDir "$packageName-installer.exe"

          if (!(Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw "Windows NSIS installer was not generated: $installerPath"
          }

          # Upload only the two distributable files.
          $releaseDir = Join-Path $PWD "dist/release"

          if (Test-Path -LiteralPath $releaseDir) {
            Remove-Item -LiteralPath $releaseDir -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          Copy-Item -LiteralPath $zipPath -Destination $releaseDir
          Copy-Item -LiteralPath $installerPath -Destination $releaseDir

          Write-Host ""
          Write-Host "Final Windows release files:"
          Get-ChildItem -LiteralPath $releaseDir -File |
            ForEach-Object {
              Write-Host "  $($_.Name) ($($_.Length) bytes)"
            }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruzu-windows
          path: dist/release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs:
      - linux
      - steamdeck
      - windows

    if: >-
      always() &&
      !cancelled() &&
      (inputs.build_target != 'linux' || needs.linux.result == 'success') &&
      (inputs.build_target != 'steamdeck' || needs.steamdeck.result == 'success') &&
      (inputs.build_target != 'windows' || needs.windows.result == 'success') &&
      (
        inputs.build_target == 'all' ||
        inputs.build_target == 'linux' ||
        inputs.build_target == 'steamdeck' ||
        inputs.build_target == 'windows'
      )

    runs-on: ubuntu-24.04

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ruzu-*
          path: release-assets
          merge-multiple: true

      - name: List release files
        run: |
          find release-assets -maxdepth 3 -type f -print
          test -n "$(find release-assets -type f -print -quit)"

      - name: Generate release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="ci-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ inputs.release_name }}
          target_commitish: ${{ github.sha }}
          files: release-assets/**/*
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
