name: Build and Release

on:
  workflow_dispatch:
    inputs:
      build_target:
        description: "Select which platform to build"
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - steamdeck
          - windows

      release_tag:
        description: "Release tag (empty = automatic CI tag)"
        required: false
        type: string
        default: ""

      release_name:
        description: "Release name"
        required: true
        type: string
        default: "Ruzu CI Build"

      prerelease:
        description: "Mark release as prerelease"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:

  # ================================================
  # LINUX APPIMAGE
  # ================================================

  linux:
    name: Linux AppImage
    runs-on: ubuntu-24.04

    if: inputs.build_target == 'all' || inputs.build_target == 'linux'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            lld \
            cmake \
            ninja-build \
            pkg-config \
            git \
            curl \
            wget \
            file \
            patchelf \
            libgtk-4-dev \
            libadwaita-1-dev \
            libssl-dev \
            libvulkan-dev \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libopus-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-appimage
          cache-targets: true

      - name: Verify FFmpeg dependencies
        run: |
          pkg-config --modversion libavcodec
          pkg-config --modversion libavutil
          pkg-config --modversion libswscale

      - name: Build Linux AppImage
        run: |
          chmod +x build.sh
          ./build.sh appimage --skip-deps

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruzu-linux
          path: |
            target/release/*.AppImage
            target/release/*.sha256
          if-no-files-found: error
          compression-level: 0


  # ================================================
  # STEAM DECK APPIMAGE
  # ================================================

  steamdeck:
    name: Steam Deck AppImage
    runs-on: ubuntu-24.04

    if: inputs.build_target == 'all' || inputs.build_target == 'steamdeck'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: steamdeck
          cache-targets: true

      - name: Build Steam Deck AppImage
        run: |
          chmod +x build.sh
          ./build.sh steamdeck --jobs 2

      - name: Upload Steam Deck artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruzu-steamdeck
          path: |
            target/steamdeck/artifacts/*.AppImage
            target/steamdeck/artifacts/*.sha256
          if-no-files-found: error
          compression-level: 0


  # ================================================
  # WINDOWS BUILD
  # ================================================

  windows:
    name: Windows Build
    runs-on: windows-2022

    if: inputs.build_target == 'all' || inputs.build_target == 'windows'

    env:
      RUZU_SETUP_ASSUME_YES: "1"

      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\.vcpkg-cache,readwrite"

      VCPKG_DOWNLOADS: "${{ github.workspace }}\\.vcpkg-downloads"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Create cache directories
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ".vcpkg-cache"
          New-Item -ItemType Directory -Force -Path ".vcpkg-downloads"

      # --------------------------------------------
      # VCPKG BINARY CACHE
      # --------------------------------------------

      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-binary-${{ runner.os }}-${{ hashFiles('scripts/vcpkg-triplets/**', 'scripts/vcpkg-ports/**', 'scripts/build.ps1', '**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-binary-${{ runner.os }}-

      # --------------------------------------------
      # VCPKG DOWNLOAD CACHE
      # --------------------------------------------

      - name: Cache vcpkg downloads
        uses: actions/cache@v4
        with:
          path: .vcpkg-downloads
          key: vcpkg-downloads-${{ runner.os }}-${{ hashFiles('scripts/vcpkg-triplets/**', 'scripts/vcpkg-ports/**', 'scripts/build.ps1', '**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-downloads-${{ runner.os }}-

      # --------------------------------------------
      # RUST CACHE
      # --------------------------------------------

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
          cache-targets: true

      # --------------------------------------------
      # BUILD AND PACKAGE
      # --------------------------------------------

      - name: Build and package Windows
        shell: cmd
        run: |
          call build.bat package

      # --------------------------------------------
      # VERIFY PACKAGE OUTPUT
      # --------------------------------------------

      - name: Verify Windows packages
        shell: pwsh
        run: |
          $PackageDir = "target/package"

          if (!(Test-Path $PackageDir)) {
            throw "Package directory was not created: $PackageDir"
          }

          $Files = Get-ChildItem $PackageDir -File -Recurse

          if ($Files.Count -eq 0) {
            throw "No Windows package files were generated"
          }

          Write-Host "Windows package contents:"
          $Files | ForEach-Object {
            Write-Host $_.FullName
          }

      # --------------------------------------------
      # UPLOAD COMPLETE DIRECTORY
      # --------------------------------------------

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: ruzu-windows
          path: target/package/
          if-no-files-found: error
          compression-level: 0


  # ================================================
  # GITHUB RELEASE
  # ================================================

  release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04

    needs:
      - linux
      - steamdeck
      - windows

    if: |
      always() &&
      !cancelled() &&
      (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
      (needs.steamdeck.result == 'success' || needs.steamdeck.result == 'skipped') &&
      (needs.windows.result == 'success' || needs.windows.result == 'skipped')

    steps:

      # --------------------------------------------
      # DOWNLOAD LINUX
      # --------------------------------------------

      - name: Download Linux artifact
        if: needs.linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ruzu-linux
          path: release-assets/linux

      # --------------------------------------------
      # DOWNLOAD STEAM DECK
      # --------------------------------------------

      - name: Download Steam Deck artifact
        if: needs.steamdeck.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ruzu-steamdeck
          path: release-assets/steamdeck

      # --------------------------------------------
      # DOWNLOAD WINDOWS
      # --------------------------------------------

      - name: Download Windows artifact
        if: needs.windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ruzu-windows
          path: release-assets/windows

      # --------------------------------------------
      # GENERATE RELEASE TAG
      # --------------------------------------------

      - name: Generate release tag
        id: release_tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="ci-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release tag: $TAG"

      # --------------------------------------------
      # CREATE RELEASE
      # --------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ inputs.release_name }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          make_latest: false
          files: release-assets/**/*
